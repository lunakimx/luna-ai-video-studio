name: Validate Luna AI Video Studio

on:
  push:
    paths:
      - 'skills/luna-ai-video-studio/**'
      - '.github/workflows/validate-luna-ai-video-studio.yml'
  pull_request:
    paths:
      - 'skills/luna-ai-video-studio/**'
      - '.github/workflows/validate-luna-ai-video-studio.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate skill integrity
        run: python skills/luna-ai-video-studio/tests/validate_skill.py

      - name: Validate Fia and Theo rules and fixtures
        run: python skills/luna-ai-video-studio/tests/test_fia_theo.py

      - name: Install ffmpeg for output QC integration tests
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Validate output resolution QC
        run: python skills/luna-ai-video-studio/tests/test_video_qc.py
